<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boardroom 3D — isolated prototype</title><style>body{margin:0;background:#090d15;color:#eacb8e;font:15px Arial}header,nav{padding:12px;text-align:center}button{margin:4px;padding:11px;background:#b38a47;border:0;border-radius:7px;color:#111;font-weight:bold}canvas{display:block;width:100%;height:65vh}#status{text-align:center;padding:8px}</style><header>ORDELIAN — CAPTAIN'S BOARDROOM · 3D DEVELOPMENT PROTOTYPE</header><div id="scene"></div><nav><button id="roll">Roll call</button><button id="dismiss">Dismiss all</button><button id="return">Return all</button><button id="quiet">Everyone quiet</button></nav><div id="status" role="status">Nine procedural figures. No AI access, microphone or external connections.</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#10151e');const camera=new THREE.PerspectiveCamera(48,innerWidth/(innerHeight*.65),.1,100);camera.position.set(0,2.1,8.9);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight*.65);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe9d8b4,0x242d42,2));const lamp=new THREE.DirectionalLight(0xffd99a,2);lamp.position.set(2,8,4);scene.add(lamp);
function box(w,h,d,color,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.65}));m.position.set(x,y,z);parent.add(m);return m}
box(18,.15,18,0x222a34,0,-.13,0);box(16,6,.2,0x1b2330,0,3,-5);box(6,.13,3.6,0x513821,0,1.08,0);box(6,.08,3.6,0x9e7743,0,1.17,0);
const names=['Chet','Margaret','Adrian','Sandra','George','Jimmy','Nova','Atlas','Vera'];const figures=[];
names.forEach((name,i)=>{const side=i<5?-1:1;const slot=i<5?i: i-5;const x=side*(1.0+slot*.62),z=(slot-2)*.52;const root=new THREE.Group();scene.add(root);root.position.set(x,0,z);root.rotation.y=side<0?-.65:.65;
box(.55,.6,.55,0x353d4c,0,.6,-.18,root);box(.6,.13,.5,0x454f60,0,.55,.1,root);
const body=new THREE.Group();root.add(body);body.position.y=.82;box(.36,.65,.24,[0x303d58,0x5a344a,0x374e4b][i%3],0,.25,0,body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12),new THREE.MeshStandardMaterial({color:[0xd5a77e,0x9f694d,0xe0bd9b][i%3]}));head.position.y=.78;body.add(head);
const arm=new THREE.Group();arm.position.set(.25,.51,0);body.add(arm);box(.13,.52,.13,0xc9a080,0,-.23,0,arm);
const left=new THREE.Group();left.position.set(-.25,.51,0);body.add(left);box(.13,.52,.13,0xc9a080,0,-.23,0,left);
figures.push({name,root,body,arm,left,x,z,side,state:'seated',progress:0,hand:0});
});
let time=0;function tick(){requestAnimationFrame(tick);time+=.016;figures.forEach((f,i)=>{f.body.position.y=.82+Math.sin(time*1.3+i)*.013;f.body.rotation.z=Math.sin(time*.8+i)*.015;f.arm.rotation.z=THREE.MathUtils.lerp(f.arm.rotation.z,f.hand? -2.6: -.15,.1);if(f.state==='leaving'){f.progress=Math.min(1,f.progress+.012);f.root.position.x=f.x+f.side*f.progress*8;f.root.rotation.y=f.side*Math.PI/2;if(f.progress>=1){f.root.visible=false;f.state='absent'}}if(f.state==='returning'){f.root.visible=true;f.progress=Math.max(0,f.progress-.012);f.root.position.x=f.x+f.side*f.progress*8;f.root.rotation.y=f.side*Math.PI/2*(f.progress)+ (f.side<0?-.65:.65)*(1-f.progress);if(f.progress<=0)f.state='seated'}});renderer.render(scene,camera)}tick();
const status=document.querySelector('#status');document.querySelector('#roll').onclick=()=>{figures.forEach(f=>{if(f.state==='seated')f.hand=1});status.textContent='Roll call: present executives raise their right hands.';setTimeout(()=>figures.forEach(f=>f.hand=0),1800)};
document.querySelector('#dismiss').onclick=()=>{figures.forEach(f=>{if(f.state==='seated'){f.state='leaving';f.hand=0}});status.textContent='All executives leaving the room.'};
document.querySelector('#return').onclick=()=>{figures.forEach(f=>{if(f.state==='absent'||f.state==='leaving'){f.state='returning';f.progress=Math.max(f.progress,.01)}});status.textContent='Executives returning to their seats.'};
document.querySelector('#quiet').onclick=()=>{figures.forEach(f=>f.hand=0);status.textContent='Everyone quiet. This prototype has no audio.'};
addEventListener('resize',()=>{camera.aspect=innerWidth/(innerHeight*.65);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight*.65)});
</script></html>
